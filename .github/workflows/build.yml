---
name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Run Build and Tests
    runs-on: ubuntu-24.04

    env:
      PROG: systemd-if

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: "false"
          show-progress: "false"

      - name: Create temporary file
        id: tmp
        run: echo "file=$(mktemp --tmpdir=${RUNNER_TEMP})" | tee --append "${GITHUB_OUTPUT}"

      - name: Save commit message to file
        run: git --no-pager log -1 --no-color --pretty=%B | tee "${FILE}"
        env:
          FILE: ${{ steps.tmp.outputs.file }}

      - name: Verify if commit is conventional
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: verify
          args: --ignore-merge-commits --ignore-fixup-commits --file ${{ steps.tmp.outputs.file }}

      - name: Remove temporary file
        if: steps.go.outputs.dirs != ''
        run: rm --force -- "${FILE}"
        env:
          FILE: ${{ steps.tmp.outputs.file }}

      - name: Get next version
        id: next
        run: |
          NEXT_VERSION=$(cog bump --auto --dry-run |
            sed --silent --regexp-extended 's/^v([[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+)$/\1/p')
          echo "version=${NEXT_VERSION}" | tee --append "${GITHUB_OUTPUT}"

      - name: Update packages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sudo apt-get update --yes --quiet=2 && sudo apt-get upgrade --yes --quiet=2

      - name: Install build necessities
        run: |
          sudo apt-get install --yes --quiet=2 \
            --no-install-recommends --option DPkg::NoTriggers=true \
            build-essential libsystemd-dev libcap-dev

      - name: Build project
        run: make VERSION="${VERSION}"
        env:
          VERSION: ${{ steps.next.outputs.version }}

      - name: Test run
        run: ./${PROG} --version

      - name: Upload artifact bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROG }}
          path: |
            LICENSE
            nfpm.yaml
            ${{ env.PROG }}
          retention-days: 1
          compression-level: 9
          overwrite: true
